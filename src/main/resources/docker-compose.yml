# Use root/example as user/password credentials
version: '3.1'
services:

  db:
    container_name: mariadb
    image: mariadb:10.7
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${PASSWORD}
    ports:
      - '3307:3306'

  adminer:
    container_name: adminer-sa
    image: adminer
    restart: always
    ports:
      - '8081:8080'
