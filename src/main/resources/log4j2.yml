Configuration:
  status: warn
  name: MyAppConfig

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"

    RollingFile:
      name: File
      fileName: logs/application.log
      filePattern: logs/application-%d{yyyy-MM-dd}-%i.log.gz
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
      Policies:
        SizeBasedTriggeringPolicy:
          size: 10 MB
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: true
      DefaultRolloverStrategy:
        max: 10

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console
        - ref: File

    Logger:
      - name: com.example.observe
        level: debug
        additivity: false
        AppenderRef:
          - ref: File